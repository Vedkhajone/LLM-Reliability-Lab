[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reliability-lab"
version = "0.1.0"
description = "LLM Reliability Lab: reproducible behavioral-reliability and adversarial evaluation of LLMs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "matplotlib>=3.8",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
providers = ["anthropic>=0.40", "openai>=1.50", "google-genai>=1.0"]
local = ["transformers>=4.44", "torch>=2.2"]
semantic = ["sentence-transformers>=3.0"]
viz = ["seaborn>=0.13", "plotly>=5.20", "streamlit>=1.35"]
tracking = ["mlflow>=2.10"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
